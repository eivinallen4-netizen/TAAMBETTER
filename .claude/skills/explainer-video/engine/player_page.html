<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;700&family=Russo+One&display=block">
<style>
:root{--bg:#141210;--bar:#1d1a17;--ink:#e9dcbc;--dim:#a89a7c;--orange:#F46325;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.3 Oswald,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#stage{flex:1;min-height:0;display:grid;place-items:center;padding:12px 16px;position:relative}
#cv{display:block;height:100%;max-height:100%;max-width:100%;aspect-ratio:{{W}}/{{H}};object-fit:contain;background:#e9dcbc;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#drop{position:absolute;inset:12px 16px;border:3px dashed var(--orange);display:grid;place-items:center;font:400 28px Anton,Impact,sans-serif;letter-spacing:.04em;color:var(--orange);background:rgba(20,18,16,.85)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bar);border-top:2px solid #000}
button,.file{font:700 13px/1 Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:#000;border:2px solid var(--ink);padding:8px 12px;cursor:pointer}
button:hover,.file:hover{border-color:var(--orange);color:var(--orange)}
button:focus-visible,.file:focus-within,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
#play{background:var(--orange);border-color:var(--orange);color:#111;min-width:74px}
#scrub{flex:1 1 180px;min-width:120px;accent-color:var(--orange)}
#time{font-variant-numeric:tabular-nums;min-width:92px;text-align:right}
label.chk{display:flex;align-items:center;gap:6px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;font-size:13px;cursor:pointer}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.file{position:relative}
#vo{color:var(--dim);font-size:13px;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<div id="stage"><canvas id="cv" width="{{W}}" height="{{H}}" aria-label="Animated explainer: {{TITLE}}"></canvas><div id="drop" hidden>Drop the voiceover audio</div></div>
<div class="bar">
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="60" step="0.01" value="0" aria-label="Scrub">
  <span id="time">0:00.0</span>
  <label class="chk"><input id="snd" type="checkbox" checked> Sound</label>
  <label class="chk"><input id="loop" type="checkbox" checked> Loop</label>
  <label class="file">Load voiceover<input id="file" type="file" accept="audio/*"></label>
  <span id="vo">no voiceover · own clock</span>
</div>
