<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:500;src:url('file:///C:/Users/Theo/Desktop/TAAMBETTER/lib/fonts/Montserrat-Medium.ttf')}@font-face{font-family:M;font-weight:600;src:url('file:///C:/Users/Theo/Desktop/TAAMBETTER/lib/fonts/Montserrat-Bold.ttf')}@font-face{font-family:M;font-weight:700;src:url('file:///C:/Users/Theo/Desktop/TAAMBETTER/lib/fonts/Montserrat-ExtraBold.ttf')}@font-face{font-family:M;font-weight:800;src:url('file:///C:/Users/Theo/Desktop/TAAMBETTER/lib/fonts/Montserrat-Black.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
:root{--orange:#F46325;--ink:#111;--white:#fff}
html,body{width:1512px;height:256px;overflow:hidden}
body{background:var(--orange);color:var(--white);font-family:M,sans-serif;position:relative}
.copy{position:absolute;left:340px;right:30px;top:84px;display:flex;flex-direction:column-reverse}
h1{font-weight:900;text-transform:uppercase;font-size:110px;line-height:.86;letter-spacing:-.035em;white-space:nowrap;width:max-content}
.outline{color:var(--orange);-webkit-text-stroke:4px var(--white);paint-order:stroke fill}
.sub{margin:0 0 14px 4px;font-weight:700;font-size:22px;letter-spacing:.02em;display:flex;gap:18px;align-items:center}
.sub b{display:inline-block;width:37.4px;height:4px;background:var(--white)}
.char{position:absolute;height:190px}
</style></head><body>
<div class="copy">
  <h1>Better <span class="outline" id="m">marketing</span></h1>
  <p class="sub"><b></b>Built for the best businesses.</p>
</div>
<img class="char" id="c" src="file:///C:/Users/Theo/Desktop/TAAMBETTER/flyers/linkedin/characters/sitting-ledge.png">
<script>
document.fonts.load('900 100px M').then(()=>{
// Fit the headline to the space, then sit the mascot on top of "MARKETING".
const h=document.querySelector('h1'),max=1142;let f=160;h.style.fontSize=f+'px';
while(h.offsetWidth>max&&f>60){f-=2;h.style.fontSize=f+'px'}
const m=document.getElementById('m'),c=document.getElementById('c');
// Exact top of the "G" his hand rests on: baseline minus the glyph's ascent, plus half the outline stroke.
const probe=document.createElement('span');probe.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';
m.appendChild(probe);const baseline=probe.getBoundingClientRect().top;probe.remove();
const ctx=document.createElement('canvas').getContext('2d');ctx.font='900 '+f+'px M';
const ledge=baseline-ctx.measureText('G').actualBoundingBoxAscent-2;
c.style.top=(ledge-190*0.673)+'px';
// Center the resting hand (x 70-88% of the image) over the actual G glyph.
const t=m.firstChild,rg=document.createRange();rg.setStart(t,t.length-1);rg.setEnd(t,t.length);
const G=rg.getBoundingClientRect();c.style.left=(G.left+G.width/2-190*0.79)+'px';
});
</script>
</body></html>
