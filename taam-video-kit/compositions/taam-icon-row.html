<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      container-type: size;
      overflow: hidden;
      font-family: "Montserrat", sans-serif;
      color: #fff;
    }
    .ir-bg { position: absolute; inset: 0; background: var(--ir-bg, #f46325); }
    .ir-ht {
      position: absolute;
      left: -30%;
      top: -30%;
      width: 160%;
      height: 160%;
      background-image: radial-gradient(circle, var(--ir-dot, rgba(17, 17, 17, 0.14)) 0 30%, transparent 33%);
      background-size: 1.5cqmin 1.5cqmin;
      -webkit-mask-image: radial-gradient(45% 40% at 50% 85%, #000, transparent 75%);
      mask-image: radial-gradient(45% 40% at 50% 85%, #000, transparent 75%);
    }
    .ir-head-mask { position: absolute; left: 0; right: 0; top: 11cqh; overflow: hidden; text-align: center; padding-bottom: 0.6cqmin; }
    .ir-head {
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.045em;
      line-height: 0.9;
      font-size: 7.5cqmin;
      white-space: nowrap;
    }
    .ir-row {
      position: absolute;
      left: 8cqw;
      right: 8cqw;
      top: 32cqh;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4cqw;
    }
    .ir-item { text-align: center; }
    .ir-card {
      aspect-ratio: 1;
      width: 74%;
      margin: 0 auto;
      border-radius: 3.6cqmin;
      background: #fff;
      box-shadow: 1.2cqmin 1.2cqmin 0 #111111;
      display: grid;
      place-items: center;
    }
    .ir-card img { width: 78%; height: 78%; object-fit: contain; display: block; }
    .ir-word-mask { overflow: hidden; margin-top: 3.4cqmin; padding-bottom: 0.6cqmin; }
    .ir-word {
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.035em;
      line-height: 0.95;
      font-size: 5.6cqmin;
      white-space: nowrap;
    }
    .ir-item:nth-child(2) .ir-word { color: var(--ir-bg, #f46325); -webkit-text-stroke: 0.36cqmin #fff; paint-order: stroke fill; }
  </style>
  <div
    id="root"
    data-composition-id="taam-icon-row"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[
      {"id":"headline","type":"string","label":"Headline (optional)","default":"What we fix"},
      {"id":"prop1","type":"string","label":"Item 1 art (a props/ name)","default":"search-bar"},
      {"id":"word1","type":"string","label":"Item 1 word","default":"Found"},
      {"id":"prop2","type":"string","label":"Item 2 art","default":"phone-ringing"},
      {"id":"word2","type":"string","label":"Item 2 word","default":"Called"},
      {"id":"prop3","type":"string","label":"Item 3 art","default":"calendar"},
      {"id":"word3","type":"string","label":"Item 3 word","default":"Booked"},
      {"id":"tone","type":"enum","label":"Ground","default":"orange","options":[{"value":"orange","label":"Orange"},{"value":"ink","label":"Ink"}]},
      {"id":"hold","type":"number","label":"Seconds on screen (match the host data-duration)","default":4,"min":2,"max":30,"step":0.5,"unit":"s"}
    ]'
  >
    <div class="ir-bg"></div>
    <div class="ir-ht" data-layout-ignore></div>
    <div class="ir-head-mask"><div class="ir-head">What we fix</div></div>
    <div class="ir-row">
      <div class="ir-item"><div class="ir-card"><img src="assets/props/search-bar.webp" alt="" /></div><div class="ir-word-mask"><div class="ir-word">Found</div></div></div>
      <div class="ir-item"><div class="ir-card"><img src="assets/props/phone-ringing.webp" alt="" /></div><div class="ir-word-mask"><div class="ir-word">Called</div></div></div>
      <div class="ir-item"><div class="ir-card"><img src="assets/props/calendar.webp" alt="" /></div><div class="ir-word-mask"><div class="ir-word">Booked</div></div></div>
    </div>
    <div class="ir-drv clip" data-start="0" data-duration="30" style="position:absolute;width:1px;height:1px;opacity:0"></div>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      var row = Array.prototype.filter.call(document.querySelectorAll(".ir-row"), function (w) { return !w.hasAttribute("data-bound"); })[0];
      row.setAttribute("data-bound", "");
      var root = row.parentNode;
      var q = function (s) { return root.querySelector(s); };
      var hold = Number(v.hold) || 4;
      if (v.headline != null) q(".ir-head").textContent = v.headline;
      if (!v.headline) q(".ir-head-mask").style.display = "none";
      if (v.tone === "ink") {
        root.style.setProperty("--ir-bg", "#111111");
        root.style.setProperty("--ir-dot", "rgba(255,255,255,0.07)");
      }
      var items = row.querySelectorAll(".ir-item");
      [1, 2, 3].forEach(function (n, i) {
        if (v["prop" + n]) items[i].querySelector("img").src = "assets/props/" + v["prop" + n] + ".webp";
        if (v["word" + n] != null) items[i].querySelector(".ir-word").textContent = v["word" + n];
      });

      var tl = gsap.timeline({ paused: true });
      var out = hold - 0.45;
      tl.fromTo(q(".ir-ht"), { rotation: 45, x: 0 }, { rotation: 45, x: 40, duration: hold, ease: "none" }, 0);
      tl.fromTo(q(".ir-head"), { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 0.05);
      // One beat per item: card pops, then its word rises. Reads as a 1-2-3.
      items.forEach(function (it, i) {
        var t = 0.3 + i * 0.32;
        tl.fromTo(it.querySelector(".ir-card"), { scale: 0, rotation: (i - 1) * 14 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.9)" }, t);
        tl.fromTo(it.querySelector(".ir-word"), { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, t + 0.15);
        tl.to(it.querySelector(".ir-card"), { scale: 0, duration: 0.25, ease: "power3.in" }, out + i * 0.04);
        tl.to(it.querySelector(".ir-word"), { yPercent: -105, duration: 0.25, ease: "power3.in" }, out + i * 0.04);
      });
      tl.to(q(".ir-head"), { yPercent: -105, duration: 0.25, ease: "power3.in" }, out);

      window.__timelines["taam-icon-row"] = tl;
    })();
  </script>
</template>
