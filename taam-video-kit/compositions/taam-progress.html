<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      container-type: size;
      background: transparent;
      pointer-events: none;
    }
    .pg-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1.1cqmin;
      background: rgba(17, 17, 17, 0.55);
    }
    .pg-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      background: #f46325;
      transform-origin: 0 50%;
    }
    .pg-rider {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
    }
    .pg-mark {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 4.4cqmin;
      height: 4.4cqmin;
      margin-left: -2.2cqmin;
      border-radius: 50%;
      background: #f46325;
      box-shadow: 0 0 0 0.3cqmin #fff;
      display: grid;
      place-items: center;
    }
    .pg-mark img { width: 2.8cqmin; display: block; }
  </style>
  <div
    id="root"
    data-composition-id="taam-progress"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[
      {"id":"length","type":"number","label":"Video length in seconds (match the host data-duration)","default":30,"min":2,"max":600,"step":0.5,"unit":"s"}
    ]'
  >
    <div class="pg-track" data-layout-allow-overflow>
      <div class="pg-fill"></div>
      <div class="pg-rider"><div class="pg-mark"><img src="assets/brand/taam-mark-white.svg" alt="" /></div></div>
    </div>
    <div class="pg-drv clip" data-start="0" data-duration="600" style="position:absolute;width:1px;height:1px;opacity:0"></div>
  </div>
  <script>
    (function () {
      // A Shorts-style progress bar along the bottom edge, with the A-mark riding the tip.
      var v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      var track = Array.prototype.filter.call(document.querySelectorAll(".pg-track"), function (w) { return !w.hasAttribute("data-bound"); })[0];
      track.setAttribute("data-bound", "");
      var len = Number(v.length) || 30;
      var fill = track.querySelector(".pg-fill");
      var mark = track.querySelector(".pg-mark");

      var tl = gsap.timeline({ paused: true });
      // Progress is the one place linear is right.
      tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: len, ease: "none" }, 0);
      tl.fromTo(mark, { x: 0 }, { x: (track.offsetWidth || 1920) - mark.offsetWidth / 2, duration: len, ease: "none" }, 0);
      tl.fromTo(mark.querySelector("img"), { rotation: 0 }, { rotation: 360 * Math.round(len / 4), duration: len, ease: "none" }, 0);

      window.__timelines["taam-progress"] = tl;
    })();
  </script>
</template>
