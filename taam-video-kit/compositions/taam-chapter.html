<template>
  <style>
    #root {
      position: absolute;
      inset: 0;

      overflow: hidden;
      font-family: "Montserrat", sans-serif;
      color: #fff;
      background: #111111;
    }
    .ch-num {
      position: absolute;
      left: 6cqw;
      top: 50%;
      font-weight: 900;
      font-size: 46cqmin;
      line-height: 0.8;
      letter-spacing: -0.06em;
      color: #111111;
      -webkit-text-stroke: 0.7cqmin #f46325;
      paint-order: stroke fill;
    }
    .ch-copy {
      position: absolute;
      left: 46cqw;
      right: 6cqw;
      top: 50%;
    }
    .ch-eyebrow {
      font-weight: 700;
      font-size: 2.6cqmin;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #ff9a66;
    }
    .ch-rule {
      height: 0.6cqmin;
      background: #f46325;
      margin: 2.4cqmin 0 3cqmin;
      transform-origin: 0 50%;

    .ch-mask { overflow: hidden; padding-bottom: 0.6cqmin; }
    .ch-title {
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.045em;
      line-height: 0.88;
      font-size: 10cqmin;
      text-wrap: balance;
    }
  </style>
  <div
    id="root"
    data-composition-id="taam-chapter"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[
      {"id":"number","type":"string","label":"Chapter number","default":"01"},
      {"id":"eyebrow","type":"string","label":"Eyebrow","default":"Chapter"},
      {"id":"title","type":"string","label":"Chapter title","default":"Get found on Google"},
      {"id":"hold","type":"number","label":"Seconds on screen (match the host data-duration)","default":3.5,"min":2,"max":30,"step":0.5,"unit":"s"}
    ]'
  >
    <div class="ch-num">01</div>
    <div class="ch-copy">
      <div class="ch-mask"><div class="ch-eyebrow">Chapter</div></div>
      <div class="ch-rule"></div>
      <div class="ch-mask"><div class="ch-title">Get found on Google</div></div>
    </div>
    <div class="ch-drv clip" data-start="0" data-duration="30" style="position:absolute;width:1px;height:1px;opacity:0"></div>
  </div>
  <script>
    (function () {
      // GSAP can't tween container units, so frame-relative distances are converted to px here.
      function cq(n, u) { var w = window.innerWidth || 1920, h = window.innerHeight || 1080; return n * (u === "w" ? w : u === "h" ? h : Math.min(w, h)) / 100; }
      var v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      var root = Array.prototype.filter.call(document.querySelectorAll(".ch-copy"), function (w) { return !w.hasAttribute("data-bound"); })[0].parentNode;
      root.querySelector(".ch-copy").setAttribute("data-bound", "");
      var q = function (s) { return root.querySelector(s); };

      var hold = Number(v.hold) || 3.5;
      if (v.number != null) q(".ch-num").textContent = v.number;
      if (v.eyebrow != null) q(".ch-eyebrow").textContent = v.eyebrow;
      if (v.title != null) q(".ch-title").textContent = v.title;

      var tl = gsap.timeline({ paused: true });
      var out = hold - 0.45;

      // The number whips in from the left and lands sharp; the rule draws; the title rises.
      tl.fromTo(q(".ch-num"), { yPercent: -50, x: cq(-30, "w"), filter: "blur(14px)" }, { yPercent: -50, x: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0.05);
      tl.fromTo(q(".ch-copy"), { yPercent: -50 }, { yPercent: -50, duration: 0.01 }, 0);
      tl.fromTo(q(".ch-eyebrow"), { yPercent: 110 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, 0.25);
      tl.fromTo(q(".ch-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.3);
      tl.fromTo(q(".ch-title"), { yPercent: 105 }, { yPercent: 0, duration: 0.65, ease: "expo.out" }, 0.4);

      tl.to(q(".ch-num"), { x: cq(-20, "w"), filter: "blur(12px)", opacity: 0, duration: 0.35, ease: "power3.in" }, out);
      tl.to([q(".ch-eyebrow"), q(".ch-title")], { yPercent: -105, duration: 0.3, ease: "power3.in", stagger: 0.05 }, out + 0.05);
      tl.to(q(".ch-rule"), { scaleX: 0, transformOrigin: "100% 50%", duration: 0.3, ease: "power3.in" }, out + 0.05);

      window.__timelines["taam-chapter"] = tl;
    })();
  </script>
