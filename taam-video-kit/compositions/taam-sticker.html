<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      container-type: size;
      font-family: "Montserrat", sans-serif;
      background: transparent;
      pointer-events: none;
    }
    .sk-pos { position: absolute; left: var(--sk-x, 72cqw); top: var(--sk-y, 40cqh); width: 0; height: 0; }
    .sk-body {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--sk-size, 34cqmin);
    }
    /* Die-cut sticker edge: the art outlined in white, then a hard ink offset like the site's cards. */
    .sk-art {
      display: block;
      width: 100%;
      filter: drop-shadow(0.5cqmin 0 0 #fff) drop-shadow(-0.5cqmin 0 0 #fff) drop-shadow(0 0.5cqmin 0 #fff)
        drop-shadow(0 -0.5cqmin 0 #fff) drop-shadow(0.9cqmin 0.9cqmin 0 rgba(17, 17, 17, 0.9));
    }
    .sk-tag {
      position: absolute;
      left: 50%;
      top: 100%;
      margin-top: 1cqmin;
      background: #f46325;
      color: #fff;
      border-radius: 999px;
      padding: 1cqmin 2.4cqmin;
      font-weight: 900;
      font-size: 3cqmin;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0.6cqmin 0.6cqmin 0 #111111;
    }
  </style>
  <div
    id="root"
    data-composition-id="taam-sticker"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[
      {"id":"prop","type":"enum","label":"Sticker","default":"phone-ringing","options":[{"value":"phone-ringing","label":"Ringing phone"},{"value":"map-pin","label":"Map pin"},{"value":"search-bar","label":"Search bar"},{"value":"megaphone","label":"Megaphone"},{"value":"stars","label":"Five stars"},{"value":"browser","label":"Website"},{"value":"growth","label":"Growth chart"},{"value":"calendar","label":"Booked calendar"},{"value":"clapper","label":"Clapperboard"},{"value":"notify","label":"Social heart"},{"value":"coffee-cup","label":"Coffee"},{"value":"burst","label":"Starburst"}]},
      {"id":"label","type":"string","label":"Tag under it (optional)","default":"Ring ring"},
      {"id":"x","type":"number","label":"Centre, % across","default":74,"min":10,"max":90,"step":1,"unit":"%"},
      {"id":"y","type":"number","label":"Centre, % down","default":40,"min":10,"max":85,"step":1,"unit":"%"},
      {"id":"size","type":"number","label":"Size","default":34,"min":12,"max":70,"step":1,"unit":"cqmin"},
      {"id":"tilt","type":"number","label":"Tilt","default":-8,"min":-30,"max":30,"step":1,"unit":"deg"},
      {"id":"hold","type":"number","label":"Seconds on screen (match the host data-duration)","default":3,"min":1,"max":30,"step":0.5,"unit":"s"}
    ]'
  >
    <div class="sk-pos">
      <div class="sk-body">
        <img class="sk-art" src="assets/props/phone-ringing.webp" alt="" />
        <div class="sk-tag">Ring ring</div>
      </div>
    </div>
    <div class="sk-drv clip" data-start="0" data-duration="30" style="position:absolute;width:1px;height:1px;opacity:0"></div>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      var pos = Array.prototype.filter.call(document.querySelectorAll(".sk-pos"), function (w) { return !w.hasAttribute("data-bound"); })[0];
      pos.setAttribute("data-bound", "");
      var root = pos.parentNode;
      var q = function (s) { return pos.querySelector(s); };
      var hold = Number(v.hold) || 3;
      var tilt = v.tilt != null ? Number(v.tilt) : -8;
      root.style.setProperty("--sk-x", (v.x != null ? v.x : 74) + "cqw");
      root.style.setProperty("--sk-y", (v.y != null ? v.y : 40) + "cqh");
      root.style.setProperty("--sk-size", (v.size || 34) + "cqmin");
      q(".sk-art").src = "assets/props/" + (v.prop || "phone-ringing") + ".webp";
      var label = v.label != null ? v.label : "Ring ring";
      q(".sk-tag").textContent = label;
      if (!label) q(".sk-tag").style.display = "none";

      var body = q(".sk-body");
      var tag = q(".sk-tag");
      var tl = gsap.timeline({ paused: true });
      // Slap: it comes in big and fast, hits, squashes flat, springs back. Then it is dead still.
      tl.fromTo(body, { xPercent: -50, yPercent: -50, scale: 2.4, rotation: tilt + 28, opacity: 0 },
        { scale: 0.9, rotation: tilt, opacity: 1, duration: 0.17, ease: "power3.in" }, 0.05);
      tl.to(body, { scale: 1, duration: 0.45, ease: "elastic.out(1, 0.4)" }, 0.22);
      tl.fromTo(tag, { xPercent: -50, scale: 0, rotation: -tilt * 0.6 }, { scale: 1, duration: 0.35, ease: "back.out(2.4)" }, 0.32);
      // Peel off.
      tl.to(tag, { scale: 0, duration: 0.15, ease: "power3.in" }, hold - 0.4);
      tl.to(body, { scale: 0, rotation: tilt - 40, duration: 0.25, ease: "back.in(1.6)" }, hold - 0.3);

      window.__timelines["taam-sticker"] = tl;
    })();
  </script>
</template>
