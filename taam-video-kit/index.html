<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #111111; }
      #root { width: 100%; height: 100%; font-family: "Montserrat", sans-serif; }
      /* Stand-in for your footage: swap each plate for a <video> clip (see README). */
      .plate {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #3a3f47 0%, #5d646e 55%, #474c55 100%);
        display: grid;
        place-items: center;
      }
      .plate span {
        font-weight: 900;
        font-size: 120px;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        color: transparent;
        -webkit-text-stroke: 3px rgba(255, 255, 255, 0.18);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="39" data-width="1920" data-height="1080">
      <!-- Track 0: footage (placeholders: swap for <video> clips, see README) -->
      <div id="plate-a" class="clip plate" data-start="4" data-duration="7" data-track-index="0" style="z-index:1" data-layout-ignore><span>Your footage</span></div>
      <div id="plate-b" class="clip plate" data-start="14.5" data-duration="9" data-track-index="0" style="z-index:1" data-layout-ignore><span>Your footage</span></div>

      <!-- Tracks 1 and 2: full-frame cards -->
      <div id="title" data-composition-id="taam-title" data-composition-src="compositions/taam-title.html" data-variable-values='{"eyebrow":"TAAM · Episode 01","line1":"Your website","line2":"should sell","pose":"famous","hold":4}'
        data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="chapter" data-composition-id="taam-chapter" data-composition-src="compositions/taam-chapter.html" data-variable-values='{"number":"01","eyebrow":"Chapter","title":"Get found on Google","hold":3.5}'
        data-start="11" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="stat" data-composition-id="taam-stat" data-composition-src="compositions/taam-stat.html" data-variable-values='{"value":312,"prefix":"+","suffix":"%","label":"more calls in 90 days","pose":"growth","hold":4}'
        data-start="23.5" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="punch" data-composition-id="taam-word" data-composition-src="compositions/taam-word.html" data-variable-values='{"word":"Leads","sub":"not likes","tone":"ink","hold":2}'
        data-start="27.5" data-duration="2" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="fix" data-composition-id="taam-icon-row" data-composition-src="compositions/taam-icon-row.html" data-variable-values='{"headline":"What we fix","prop1":"search-bar","word1":"Found","prop2":"phone-ringing","word2":"Called","prop3":"calendar","word3":"Booked","hold":4}'
        data-start="29.5" data-duration="4" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="end" data-composition-id="taam-end-card" data-composition-src="compositions/taam-end-card.html" data-variable-values='{"line1":"More calls.","line2":"Less guessing.","cta":"Book a call","url":"taammarketing.com","pose":"wave"}'
        data-start="33.5" data-duration="5.5" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>

      <!-- Track 3: overlays on footage -->
      <div id="name" data-composition-id="taam-lower-third" data-composition-src="compositions/taam-lower-third.html" data-variable-values='{"name":"Theo Taam","role":"Founder · TAAM Marketing","hold":3.5}'
        data-start="4.2" data-duration="3.5" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:3"></div>
      <div id="tip" data-composition-id="taam-callout" data-composition-src="compositions/taam-callout.html" data-variable-values='{"eyebrow":"Pro tip","text":"Put your phone number above the fold","side":"right","pose":"chill","hold":4}'
        data-start="14.9" data-duration="4" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:3"></div>
      <div id="services" data-composition-id="taam-ticker" data-composition-src="compositions/taam-ticker.html" data-variable-values='{"items":"Websites, SEO, Google Ads, Social media, Video","position":"low","hold":4.3}'
        data-start="19.1" data-duration="4.3" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:3"></div>
      <div id="ring" data-composition-id="taam-sticker" data-composition-src="compositions/taam-sticker.html" data-variable-values='{"prop":"phone-ringing","label":"Ring ring","x":76,"y":36,"size":30,"tilt":-8,"hold":2.8}'
        data-start="8.0" data-duration="2.8" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:3"></div>

      <!-- Track 5: captions -->
      <div id="captions" data-composition-id="taam-captions" data-composition-src="compositions/taam-captions.html" data-variable-values='{"maxWords":3}'
        data-start="7.4" data-duration="3.6" data-track-index="5" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index:4"></div>

      <!-- Track 6: brand furniture that rides the whole edit -->
      <div id="bug" data-composition-id="taam-bug" data-composition-src="compositions/taam-bug.html" data-variable-values='{"label":"TAAM","corner":"tl","hold":29.5}'
        data-start="4" data-duration="29.5" data-track-index="6" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <div id="progress" data-composition-id="taam-progress" data-composition-src="compositions/taam-progress.html" data-variable-values='{"length":39}'
        data-start="0" data-duration="39" data-track-index="7" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:9"></div>

      <!-- Track 8: transitions, each starting 0.55 s before the cut it hides -->
      <div id="wipe-1" data-composition-id="taam-transition" data-composition-src="compositions/taam-transition.html"
        data-start="10.45" data-duration="1.2" data-track-index="8" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:10"></div>
      <div id="wipe-2" data-composition-id="taam-transition" data-composition-src="compositions/taam-transition.html"
        data-start="22.95" data-duration="1.2" data-track-index="8" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:10"></div>
      <div id="wipe-3" data-composition-id="taam-transition" data-composition-src="compositions/taam-transition.html" data-variable-values='{"mark":false}'
        data-start="32.95" data-duration="1.2" data-track-index="8" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:10"></div>
      <!-- Track 9: music bed (HeyGen catalog, "punchy funky upbeat groove", 105 BPM). It enters on the drop at 9.165 s in the file, a bar line. -->
      <audio id="music" class="clip" src="assets/bgm/groove.mp3" data-start="0" data-duration="39" data-media-start="9.165" data-track-index="9" data-volume="0.75" data-fade-in="0.1" data-fade-out="2"></audio>
      <!-- Tracks 10-12: sound effects. Each starts so its peak lands one frame after its picture. Credits: assets/sfx/CREDITS.md -->
      <audio id="sfx-title-boing" class="clip" src="assets/sfx/cartoon-boing-loud.mp3" data-start="0.585" data-duration="1.0" data-track-index="10" data-volume="1.8" data-fade-out="0.2"></audio>
      <audio id="sfx-name-pop" class="clip" src="assets/sfx/pop.mp3" data-start="4.579" data-duration="0.489" data-track-index="11" data-volume="1.5"></audio>
      <audio id="sfx-name-peek" class="clip" src="assets/sfx/bubble-pop.mp3" data-start="4.985" data-duration="0.2" data-track-index="12" data-volume="0.9"></audio>
      <audio id="sfx-ring-slap" class="clip" src="assets/sfx/sticker-slap.mp3" data-start="8.06" data-duration="0.569" data-track-index="10" data-volume="0.7"></audio>
      <audio id="sfx-ring-bell" class="clip" src="assets/sfx/old-telephone-bell-ring.mp3" data-start="8.377" data-duration="1.6" data-track-index="11" data-volume="0.38" data-fade-out="0.5"></audio>
      <audio id="sfx-wipe1-whoosh" class="clip" src="assets/sfx/whoosh.mp3" data-start="10.234" data-duration="1.3" data-track-index="12" data-volume="0.8" data-fade-out="0.2"></audio>
      <audio id="sfx-wipe1-pop" class="clip" src="assets/sfx/bubble-pop.mp3" data-start="10.935" data-duration="0.2" data-track-index="10" data-volume="0.8"></audio>
      <audio id="sfx-tip-pop" class="clip" src="assets/sfx/pop.mp3" data-start="15.429" data-duration="0.489" data-track-index="11" data-volume="1.6"></audio>
      <audio id="sfx-ticker-air" class="clip" src="assets/sfx/air-whoosh-short-loud.mp3" data-start="19.02" data-duration="1.2" data-track-index="12" data-volume="1.4" data-fade-out="0.2"></audio>
      <audio id="sfx-wipe2-swoosh" class="clip" src="assets/sfx/fast-swoosh.mp3" data-start="23.326" data-duration="0.33" data-track-index="10" data-volume="0.75"></audio>
      <audio id="sfx-wipe2-pop" class="clip" src="assets/sfx/bubble-pop.mp3" data-start="23.435" data-duration="0.2" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-stat-impact" class="clip" src="assets/sfx/impact.mp3" data-start="24.351" data-duration="2.3" data-track-index="12" data-volume="0.55" data-fade-out="0.6"></audio>
      <audio id="sfx-punch-slap" class="clip" src="assets/sfx/sticker-slap.mp3" data-start="27.39" data-duration="0.569" data-track-index="10" data-volume="0.75"></audio>
      <audio id="sfx-icon1-pop" class="clip" src="assets/sfx/pop.mp3" data-start="29.979" data-duration="0.489" data-track-index="11" data-volume="1.5"></audio>
      <audio id="sfx-icon2-pop" class="clip" src="assets/sfx/bubble-pop.mp3" data-start="30.305" data-duration="0.2" data-track-index="12" data-volume="0.9"></audio>
      <audio id="sfx-icon3-pop" class="clip" src="assets/sfx/pop.mp3" data-start="30.619" data-duration="0.489" data-track-index="10" data-volume="1.5"></audio>
      <audio id="sfx-wipe3-air" class="clip" src="assets/sfx/air-whoosh-short-loud.mp3" data-start="33.17" data-duration="1.2" data-track-index="11" data-volume="1.6" data-fade-out="0.2"></audio>
      <audio id="sfx-end-boing" class="clip" src="assets/sfx/cartoon-boing-loud.mp3" data-start="34.185" data-duration="1.0" data-track-index="12" data-volume="1.8" data-fade-out="0.2"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
